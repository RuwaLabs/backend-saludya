name: Verify IAM
on:
  push:
    branches: [iam, develop, main]
  pull_request:
    branches: [iam, develop, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: iam_tests
          POSTGRES_USER: iam_test
          POSTGRES_PASSWORD: iam-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iam_test -d iam_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: saludya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: saludya/pom.xml
      - name: Verify with H2
        if: matrix.database == 'h2'
        run: ./mvnw -B -ntp verify
      - name: Verify with PostgreSQL
        if: matrix.database == 'postgres'
        env:
          IAM_TEST_DB_URL: jdbc:postgresql://localhost:5432/iam_tests
          IAM_TEST_DB_USER: iam_test
          IAM_TEST_DB_PASSWORD: iam-ci-only
          IAM_TEST_DB_DRIVER: org.postgresql.Driver
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iam-tests-${{ matrix.database }}
          path: saludya/target/surefire-reports
