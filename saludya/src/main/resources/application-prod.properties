# ============================================================
# PRODUCTION PROFILE - Render (PostgreSQL + Docker)
# ============================================================

# PostgreSQL datasource, provided through environment variables.
# Render's PostgreSQL details are mapped to DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saludyadb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Production-lean JPA behavior
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Server: Render injects PORT and expects the app to listen on it.
server.address=0.0.0.0
server.port=${PORT:8080}
