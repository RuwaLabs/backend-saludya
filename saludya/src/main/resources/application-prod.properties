# All production credentials come from the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.address=0.0.0.0
application.jwt.secret=${IAM_JWT_SECRET}
iam.notifications.encryption-key=${IAM_NOTIFICATION_KEY}
iam.identity.mode=remote
iam.identity.url=${IAM_IDENTITY_URL}
iam.staff.allowed-email-domains=${IAM_STAFF_EMAIL_DOMAINS}
iam.password-reset.url=${IAM_PASSWORD_RESET_URL}
iam.notifications.from=${IAM_MAIL_FROM}
iam.support.phone=${IAM_SUPPORT_PHONE}
iam.notifications.delivery-enabled=true
spring.mail.host=${IAM_SMTP_HOST}
spring.mail.port=${IAM_SMTP_PORT:587}
spring.mail.username=${IAM_SMTP_USER}
spring.mail.password=${IAM_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
springdoc.swagger-ui.enabled=${IAM_SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${IAM_SWAGGER_ENABLED:false}
