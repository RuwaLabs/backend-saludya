# Spring Application Name
spring.application.name=saludya-backend

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.ruwalabs.saludya.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.description=SaludYa API - RuwaLabs
documentation.application.version=@project.version@

# JWT Configuration Properties
application.jwt.secret=4S3cReTK1puB4ck3ndS3cur1tyK3yTh4tIsSuFf1c13ntlyL0ng4ndStr0ng!
application.jwt.expiration-ms=3600000

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Flyway manages the IAM schema; Hibernate ddl-auto=update creates the rest.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Show SQL queries in the console for debugging
spring.jpa.show-sql=true

# ============================================================
# Identity & Access Management (IAM)
# ============================================================
iam.jwt.issuer=saludya
iam.staff.allowed-email-domains=saludya.local,example.test

# Identity verification: fixtures (dev), reniec (real REST) or unavailable
iam.identity.mode=fixtures
iam.identity.url=
iam.identity.api-key=

iam.password-reset.url=https://example.invalid/reset-password
iam.notifications.encryption-key=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
iam.notifications.delivery-enabled=false
iam.notifications.from=no-reply@saludya.local
iam.notifications.poll-ms=5000
iam.support.instructions=Acude al area de admision con tu DNI original para verificar tu identidad y recuperar tu cuenta.
iam.support.phone=999888777
iam.rate-limit.enabled=true
iam.rate-limit.requests-per-minute=30
iam.cors.allowed-origins=

# Bootstrap a SUPER_ADMIN on startup (dev only)
iam.bootstrap.enabled=true
iam.bootstrap.email=admin@saludya.local
iam.bootstrap.password=Admin123
iam.bootstrap.dni=70000002
iam.bootstrap.phone=999888777

# SMTP Gmail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=rupwalabs@gmail.com
spring.mail.password=xxxx xxxx xxxx xxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary Configuration
cloudinary.cloud-name=xxxxxxxxx
cloudinary.api-key=xxxxxxxxxxxxx
cloudinary.api-secret=xxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# QR check-in token (signed JWT, Arrival context)
application.qr.secret=4S3cReTK1puB4ck3ndS3cur1tyK3yTh4tIsSuFf1c13ntlyL0ng4ndStr0ng!
application.qr.expiration-ms=3600000
