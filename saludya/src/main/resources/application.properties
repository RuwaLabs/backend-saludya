spring.application.name=saludya-backend
spring.profiles.default=dev
spring.jpa.hibernate.naming.physical-strategy=com.ruwalabs.saludya.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
documentation.application.description=SaludYa API - RuwaLabs
documentation.application.version=@project.version@
spring.messages.basename=messages
spring.messages.encoding=UTF-8
application.jwt.secret=${IAM_JWT_SECRET}
application.jwt.expiration-ms=${IAM_JWT_EXPIRATION_MS:3600000}
iam.jwt.issuer=saludya
iam.staff.allowed-email-domains=${IAM_STAFF_EMAIL_DOMAINS:example.test}
iam.identity.mode=${IAM_IDENTITY_MODE:unavailable}
iam.identity.url=${IAM_IDENTITY_URL:}
iam.identity.api-key=${IAM_IDENTITY_API_KEY:}
iam.password-reset.url=${IAM_PASSWORD_RESET_URL:https://example.invalid/reset-password}
iam.notifications.encryption-key=${IAM_NOTIFICATION_KEY}
iam.notifications.delivery-enabled=${IAM_MAIL_ENABLED:false}
iam.notifications.from=${IAM_MAIL_FROM:no-reply@saludya.local}
iam.notifications.poll-ms=5000
iam.support.instructions=${IAM_SUPPORT_INSTRUCTIONS:Acude al area de admision con tu DNI original para verificar tu identidad y recuperar tu cuenta.}
iam.support.phone=${IAM_SUPPORT_PHONE:}
iam.rate-limit.enabled=true
iam.rate-limit.requests-per-minute=30
iam.cors.allowed-origins=${IAM_CORS_ORIGINS:}
iam.bootstrap.enabled=${IAM_BOOTSTRAP_ENABLED:false}
iam.bootstrap.email=${IAM_BOOTSTRAP_EMAIL:}
iam.bootstrap.password=${IAM_BOOTSTRAP_PASSWORD:}
iam.bootstrap.dni=${IAM_BOOTSTRAP_DNI:}
iam.bootstrap.phone=${IAM_BOOTSTRAP_PHONE:}
spring.mail.host=${IAM_SMTP_HOST:localhost}
spring.mail.port=${IAM_SMTP_PORT:1025}
spring.mail.username=${IAM_SMTP_USER:}
spring.mail.password=${IAM_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${IAM_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${IAM_SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
